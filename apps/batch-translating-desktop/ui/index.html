<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Batch Translating</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #f7f5f0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", sans-serif;
        color: #4a4a45;
      }
      main { display: flex; align-items: center; gap: 12px; }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid #d7d3ca;
        border-top-color: #4a4a45;
        border-radius: 50%;
        animation: spin .85s linear infinite;
      }
      p { margin: 0; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, body { background: #181817; color: #d8d6d0; }
        .spinner { border-color: #3a3936; border-top-color: #d8d6d0; }
      }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在启动本地翻译引擎…</p>
    </main>
  </body>
</html>
