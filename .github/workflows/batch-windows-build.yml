name: batch-windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Stage validated RAG service resources
        run: node scripts/ci/stage-rag-service.mjs
      - name: Run desktop unit tests
        run: cargo test --locked --manifest-path apps/batch-translating-desktop/src-tauri/Cargo.toml
      - name: Build product Web and engine
        run: pnpm batch:build
      - name: Build native engine
        working-directory: apps/batch-translating-core
        env:
          KIMI_CODE_EXECUTABLE_NAME: batch-translating-engine.exe
        run: pnpm build:native:release
      - name: Stage Tauri sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force apps/batch-translating-desktop/src-tauri/binaries | Out-Null
          Copy-Item apps/batch-translating-core/dist-native/bin/win32-x64/batch-translating-engine.exe `
            apps/batch-translating-desktop/src-tauri/binaries/batch-translating-engine-x86_64-pc-windows-msvc.exe
      - name: Build NSIS installer
        working-directory: apps/batch-translating-desktop
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix $env:USERPROFILE=. --remap-path-prefix $env:GITHUB_WORKSPACE=."
          pnpm exec tauri build
      - name: Extract installer for content scan
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/batch-translating-desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced" }
          New-Item -ItemType Directory -Force dist-desktop-scan | Out-Null
          & 7z x $installer.FullName "-odist-desktop-scan" -y
          if ($LASTEXITCODE -ne 0) { throw "7z could not extract the installer" }
      - name: Scan executable and installer contents
        run: >-
          node scripts/ci/scan-artifacts.mjs
          apps/batch-translating-desktop/src-tauri/target/release/batch-translating-desktop.exe
          apps/batch-translating-desktop/src-tauri/binaries/batch-translating-engine-x86_64-pc-windows-msvc.exe
          apps/batch-translating-desktop/src-tauri/resources/translation-rag-service
          dist-desktop-scan
      - name: Collect installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-desktop | Out-Null
          Copy-Item apps/batch-translating-desktop/src-tauri/target/release/bundle/nsis/*.exe dist-desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: batch-translating-windows-${{ github.sha }}
          path: dist-desktop/*.exe
          if-no-files-found: error
