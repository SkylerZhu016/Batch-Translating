name: batch-ci

on:
  pull_request:
  push:
    branches: [main, "product/**"]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck && pnpm batch:typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and integration tests
        # Root Vitest already discovers the Batch Translating projects.
        run: pnpm test
      - name: Build product Web and engine
        run: pnpm batch:build
      - name: Scan built artifacts
        run: node scripts/ci/scan-artifacts.mjs apps/batch-translating-web/dist apps/batch-translating-core/dist
      - name: Check production dependency licenses
        run: node scripts/ci/check-licenses.mjs > third-party-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: batch-third-party-licenses
          path: third-party-licenses.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
