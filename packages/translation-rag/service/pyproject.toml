[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "batch-translating-rag-service"
version = "0.1.0"
description = "Loopback-only BGE-M3 and Qdrant retrieval service for Batch Translating"
readme = { text = "Local loopback BGE-M3 and Qdrant retrieval service for Batch Translating.", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "qdrant-client>=1.12,<2",
  "FlagEmbedding>=1.3.3,<2",
  "huggingface-hub>=0.27,<1",
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
]

[project.scripts]
batch-translating-rag = "translation_rag_service.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/translation_rag_service"]

[tool.hatch.build.targets.sdist]
include = ["src/translation_rag_service", "src/server.py", "pyproject.toml"]
